- hosts: k3s_master
  become: true
  gather_facts: no
  tasks:
    - name: Master setup
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      when: inventory_hostname in groups['k3s_master']

    - name: Get token from master
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Set k3s token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw['content'] | b64decode | trim }}"

- hosts: k3s_workers
  become: true
  tasks:
    - name: Worker setup
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      vars:
        K3S_URL: "https://{{ groups['k3s_master'][0] }}:6443"
        K3S_TOKEN: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
      args:
        creates: /usr/local/bin/k3s 
      when: inventory_hostname in groups['k3s_workers']