apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-memory
spec:
  hard:
    requests.memory: 8Gi
    limits.memory: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-container-memory
spec:
  limits:
    - type: Container
      min:
        memory: 32Mi
      max:
        memory: 1536Mi
      defaultRequest:
        memory: 128Mi
      default:
        memory: 512Mi
