apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-garage
  labels:
    app.kubernetes.io/name: receipt-garage
    app.kubernetes.io/part-of: receipt-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-garage
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:d2680ba964fee087f52f2ab231e1ff47848b4ca4
          imagePullPolicy: IfNotPresent
          command: ["garage", "server", "--single-node"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: GARAGE_ADMIN_TOKEN
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: rpc
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: garage-config-toml
              mountPath: /etc/garage.toml
              subPath: garage.toml
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: garage-config-toml
          configMap:
            name: garage-config      