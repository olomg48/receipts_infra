apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-api
  labels:
    app.kubernetes.io/name: receipt-api
    app.kubernetes.io/part-of: receipt-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-api
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      containers:
        - name: api
          image: receipt-tracker-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
