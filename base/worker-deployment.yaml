apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-api
  labels:
    app.kubernetes.io/name: receipt-worker
    app.kubernetes.io/part-of: receipt-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-worker
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: receipt-tracker-backend:dev
          command: ["python", "-m", "app.worker"]
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: DATABASE_URL
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: receipt-mistral-credentials
                  key: MISTRAL_API_KEY
            - name: S3_ENDPOINT_URL
              value: http://receipt-garage:3900
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_BUCKET
              value: receipts-bucket
            - name: S3_REGION
              value: garage
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
