apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-frontend
  labels:
    app.kubernetes.io/name: receipt-frontend
    app.kubernetes.io/part-of: receipt-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-frontend
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: receipt-tracker-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
