apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: receipts.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: receipt-frontend
                port:
                  name: http

