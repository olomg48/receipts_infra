apiVersion: v1
kind: Service
metadata:
  name: receipt-postgres-headless
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: receipt-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: receipt-postgres
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: receipt-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: receipt-postgres
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  serviceName: receipt-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-postgres
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
