apiVersion: v1
kind: Service
metadata:
  name: receipt-postgres-headless
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: receipt-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: receipt-postgres
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: receipt-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: receipt-postgres
  labels:
    app.kubernetes.io/name: receipt-postgres
    app.kubernetes.io/part-of: receipt-tracker
spec:
  serviceName: receipt-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-postgres
        app.kubernetes.io/part-of: receipt-tracker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: ghcr.io/olomg48/receipt-tracker-postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: receipt-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
